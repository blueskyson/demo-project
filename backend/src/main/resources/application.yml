server:
  port: 8081

spring:
  application:
    name: esg-award-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/esg_award
    username: esg
    password: esg
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # Batch-load lazy associations (leader, members, files) when listing proposals.
        default_batch_fetch_size: 50
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/esg-award

openfga:
  api-url: http://localhost:8090
  store-name: esg-award
  backfill-on-startup: true

app:
  cors:
    allowed-origins: http://localhost:5173
  storage:
    # Proposal files are stored on the local filesystem under this directory.
    dir: ./data/uploads

logging:
  level:
    org.springframework.security: INFO
