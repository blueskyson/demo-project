<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audit Log 驗證</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #677085; --border: #dfe3ea;
    --accent: #2f6fed; --ok: #1f8a4c; --warn: #b7791f; --err: #c53030; --code: #eef1f6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Noto Sans TC", sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; margin-right: auto; }
  main { display: grid; grid-template-columns: minmax(320px, 420px) 1fr; gap: 16px; padding: 16px 20px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  section { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; min-width: 0; }
  section h2 { font-size: 14px; margin: 0 0 10px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 2px; }
  input, textarea { width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; font: inherit; background: #fff; color: inherit; }
  textarea { min-height: 60px; resize: vertical; }
  button { padding: 6px 12px; border: 1px solid var(--border); border-radius: 6px; background: #fff; color: inherit; font: inherit; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--err); }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
  .muted { color: var(--muted); }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; background: var(--code); }
  .SUCCESS { background: #dcf3e5; color: var(--ok); }
  .DENIED { background: #fdf0d9; color: var(--warn); }
  .FAILURE { background: #fde2e2; color: var(--err); }
  .doc { border-top: 1px solid var(--border); padding: 8px 0; }
  .doc:first-child { border-top: 0; }
  .doc .id { word-break: break-all; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; }
  .changes td { background: var(--code); }
  .changes table td, .changes table th { border: 0; padding: 2px 8px; }
  .old { color: var(--err); text-decoration: line-through; }
  .new { color: var(--ok); }
  .scroll { overflow-x: auto; }
  #log { margin-top: 12px; max-height: 220px; overflow: auto; background: var(--code); border-radius: 6px; padding: 8px; white-space: pre-wrap; }
</style>
</head>
<body>
<header>
  <h1>Audit Log 驗證</h1>
  <span id="who" class="muted">未登入</span>
  <button id="login" class="primary">登入</button>
  <button id="logout" hidden>登出</button>
</header>

<main>
  <div>
    <section>
      <h2>新增 Document</h2>
      <label for="new-title">Title</label>
      <input id="new-title" value="Draft">
      <label for="new-content">Content</label>
      <textarea id="new-content">v1</textarea>
      <div class="row"><button id="create" class="primary">POST /api/documents</button></div>
    </section>

    <section style="margin-top:16px">
      <h2>對任意 id 操作(測試 403 / 404)</h2>
      <p class="muted" style="margin:0">貼上別人的 document id,用目前帳號修改或刪除，應回 403 並記錄為 DENIED。</p>
      <label for="any-id">Document id</label>
      <input id="any-id" class="mono" placeholder="uuid">
      <label for="any-title">Title</label>
      <input id="any-title" value="hacked">
      <div class="row">
        <button data-any="get">GET</button>
        <button data-any="put">PUT</button>
        <button data-any="delete" class="danger">DELETE</button>
      </div>
    </section>

    <section style="margin-top:16px">
      <h2>我的 Documents <button id="reload-docs" style="float:right">重新整理</button></h2>
      <div id="docs" class="muted">登入後顯示</div>
    </section>

    <section style="margin-top:16px">
      <h2>請求紀錄</h2>
      <div id="log" class="mono"></div>
    </section>
  </div>

  <section>
    <h2>Audit Log(需 ADMIN)</h2>
    <div class="row">
      <input id="f-entity-type" placeholder="entityType,例如 Document" style="width:180px">
      <input id="f-entity-id" class="mono" placeholder="entityId" style="width:280px">
      <input id="f-actor-id" class="mono" placeholder="actorId (sub)" style="width:280px">
      <button id="reload-audit" class="primary">查詢</button>
      <label class="muted" style="margin:0"><input type="checkbox" id="auto-audit" checked style="width:auto"> 操作後自動刷新</label>
    </div>
    <div id="audit" class="scroll muted" style="margin-top:12px">登入 admin-demo 後顯示</div>
  </section>
</main>

<script>
'use strict';

const CONFIG = {
  keycloakUrl: 'http://localhost:8080',
  realm: 'demo-realm',
  clientId: 'demo-frontend',
  apiBaseUrl: '', // served by the backend itself (same origin), so no CORS is involved
};
const OIDC = `${CONFIG.keycloakUrl}/realms/${CONFIG.realm}/protocol/openid-connect`;
const REDIRECT_URI = location.origin + location.pathname;
const $ = (id) => document.getElementById(id);

// ---------- OIDC Authorization Code + PKCE (no library) ----------

function randomString(bytes = 32) {
  return base64Url(crypto.getRandomValues(new Uint8Array(bytes)));
}

function base64Url(buffer) {
  return btoa(String.fromCharCode(...new Uint8Array(buffer)))
    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

async function login() {
  const verifier = randomString(48);
  const state = randomString(16);
  sessionStorage.setItem('pkce', JSON.stringify({ verifier, state }));
  const challenge = base64Url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
  const params = new URLSearchParams({
    client_id: CONFIG.clientId, response_type: 'code', scope: 'openid profile email',
    redirect_uri: REDIRECT_URI, state, code_challenge: challenge, code_challenge_method: 'S256',
  });
  location.assign(`${OIDC}/auth?${params}`);
}

async function handleCallback() {
  const query = new URLSearchParams(location.search);
  if (!query.has('code')) return;
  const pkce = JSON.parse(sessionStorage.getItem('pkce') || '{}');
  sessionStorage.removeItem('pkce');
  history.replaceState(null, '', REDIRECT_URI);
  if (query.get('state') !== pkce.state) throw new Error('OIDC state mismatch');
  await requestTokens({
    grant_type: 'authorization_code', code: query.get('code'),
    redirect_uri: REDIRECT_URI, code_verifier: pkce.verifier,
  });
}

async function requestTokens(form) {
  const response = await fetch(`${OIDC}/token`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({ client_id: CONFIG.clientId, ...form }),
  });
  if (!response.ok) throw new Error(`Token request failed: HTTP ${response.status}`);
  const tokens = await response.json();
  tokens.expires_at = Date.now() + tokens.expires_in * 1000;
  sessionStorage.setItem('tokens', JSON.stringify(tokens));
  return tokens;
}

function storedTokens() {
  return JSON.parse(sessionStorage.getItem('tokens') || 'null');
}

async function accessToken() {
  const tokens = storedTokens();
  if (!tokens) return null;
  if (Date.now() < tokens.expires_at - 10_000) return tokens.access_token;
  try {
    return (await requestTokens({ grant_type: 'refresh_token', refresh_token: tokens.refresh_token })).access_token;
  } catch {
    sessionStorage.removeItem('tokens');
    return null;
  }
}

function logout() {
  const tokens = storedTokens();
  sessionStorage.removeItem('tokens');
  const params = new URLSearchParams({ client_id: CONFIG.clientId, post_logout_redirect_uri: REDIRECT_URI });
  if (tokens?.id_token) params.set('id_token_hint', tokens.id_token);
  location.assign(`${OIDC}/logout?${params}`);
}

function claims(jwt) {
  const payload = jwt.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
  return JSON.parse(decodeURIComponent(escape(atob(payload))));
}

// ---------- API ----------

async function api(method, path, body) {
  const token = await accessToken();
  if (!token) throw new Error('請先登入');
  const requestId = crypto.randomUUID();
  const response = await fetch(CONFIG.apiBaseUrl + path, {
    method,
    headers: {
      Authorization: `Bearer ${token}`,
      'X-Request-Id': requestId,
      ...(body !== undefined ? { 'Content-Type': 'application/json' } : {}),
    },
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  const text = await response.text();
  const data = text ? JSON.parse(text) : null;
  logLine(`${method} ${path} → ${response.status}  (X-Request-Id ${requestId.slice(0, 8)})${
    !response.ok && data?.error ? '  ' + data.error : ''}`, response.ok);
  if (!response.ok) throw Object.assign(new Error(data?.error || `HTTP ${response.status}`), { status: response.status });
  return data;
}

function logLine(text, ok = true) {
  const line = document.createElement('div');
  line.textContent = `${new Date().toLocaleTimeString()}  ${text}`;
  line.style.color = ok ? '' : 'var(--err)';
  $('log').prepend(line);
}

// Audit entries are written asynchronously, so give the writer a moment before refreshing.
function afterMutation() {
  loadDocuments();
  if ($('auto-audit').checked) setTimeout(loadAudit, 400);
}

async function run(action) {
  try { await action(); } catch (error) { if (!error.status) logLine(error.message, false); }
  finally { afterMutation(); }
}

// ---------- Documents ----------

function el(tag, props = {}, ...children) {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children);
  return node;
}

async function loadDocuments() {
  const box = $('docs');
  if (!storedTokens()) return;
  let docs;
  try { docs = await api('GET', '/api/documents'); } catch { return; }
  box.replaceChildren();
  box.classList.toggle('muted', docs.length === 0);
  if (docs.length === 0) box.textContent = '沒有 document';
  for (const doc of docs) box.append(documentCard(doc));
}

function documentCard(doc) {
  const title = el('input', { value: doc.title });
  const content = el('textarea', { value: doc.content ?? '' });
  const id = el('div', { className: 'id mono muted', textContent: doc.id, title: '點擊複製到「任意 id」欄位' });
  id.style.cursor = 'pointer';
  id.onclick = () => { $('any-id').value = doc.id; $('f-entity-id').value = doc.id; };
  return el('div', { className: 'doc' },
    id,
    el('label', { textContent: 'Title' }), title,
    el('label', { textContent: 'Content' }), content,
    el('div', { className: 'row' },
      el('button', {
        textContent: 'PUT 儲存',
        onclick: () => run(() => api('PUT', `/api/documents/${doc.id}`, { title: title.value, content: content.value })),
      }),
      el('button', {
        textContent: 'DELETE', className: 'danger',
        onclick: () => run(() => api('DELETE', `/api/documents/${doc.id}`)),
      }),
      el('button', {
        textContent: '看這筆的 audit',
        onclick: () => { $('f-entity-type').value = 'Document'; $('f-entity-id').value = doc.id; loadAudit(); },
      })));
}

// ---------- Audit log ----------

async function loadAudit() {
  const box = $('audit');
  if (!storedTokens()) return;
  const params = new URLSearchParams({ limit: '50' });
  for (const [key, input] of [['entityType', 'f-entity-type'], ['entityId', 'f-entity-id'], ['actorId', 'f-actor-id']]) {
    if ($(input).value.trim()) params.set(key, $(input).value.trim());
  }
  let logs;
  try {
    logs = await api('GET', `/api/audit-logs?${params}`);
  } catch (error) {
    box.classList.add('muted');
    box.textContent = error.status === 403 ? '403:只有 ADMIN 可以查看(請用 admin-demo 登入)' : error.message;
    return;
  }
  box.classList.remove('muted');
  if (logs.length === 0) { box.textContent = '沒有紀錄'; return; }

  const tbody = el('tbody');
  for (const log of logs) {
    tbody.append(el('tr', {},
      el('td', { className: 'mono', textContent: new Date(log.occurredAt).toLocaleTimeString() }),
      el('td', { textContent: log.actorName ?? '' }),
      el('td', { className: 'mono', textContent: log.action }),
      el('td', {}, el('span', { className: `pill ${log.outcome}`, textContent: log.outcome })),
      el('td', { className: 'mono', textContent: [log.httpMethod, log.route].filter(Boolean).join(' ') }),
      el('td', { className: 'mono', textContent: log.path ?? '' }),
      el('td', { className: 'mono', textContent: log.durationMs != null ? `${log.durationMs} ms` : '' }),
      el('td', { className: 'mono muted', textContent: (log.requestId ?? '').slice(0, 8) })));
    if (log.errorType) {
      tbody.append(el('tr', { className: 'changes' },
        el('td', { colSpan: 8, className: 'mono', textContent: `error: ${log.errorType}` })));
    }
    if (log.changes.length > 0) tbody.append(changesRow(log.changes));
  }
  box.replaceChildren(el('table', {},
    el('thead', {}, el('tr', {}, ...['時間', 'Actor', 'Action', 'Outcome', 'Route', 'Path', '耗時', 'Request']
      .map((h) => el('th', { textContent: h })))),
    tbody));
}

function changesRow(changes) {
  const rows = changes.map((c) => el('tr', {},
    el('td', { className: 'mono', textContent: c.operation }),
    el('td', { className: 'mono', textContent: `${c.entityType}#${c.entityId.slice(0, 8)}` }),
    el('td', { className: 'mono', textContent: c.field }),
    el('td', { className: 'mono' },
      el('span', { className: 'old', textContent: c.oldValue ?? '' }),
      c.oldValue != null && c.newValue != null ? ' → ' : '',
      el('span', { className: 'new', textContent: c.newValue ?? '' }))));
  return el('tr', { className: 'changes' }, el('td', { colSpan: 8 }, el('table', {}, el('tbody', {}, ...rows))));
}

// ---------- Wiring ----------

$('login').onclick = login;
$('logout').onclick = logout;
$('reload-docs').onclick = loadDocuments;
$('reload-audit').onclick = loadAudit;
$('create').onclick = () => run(() => api('POST', '/api/documents', { title: $('new-title').value, content: $('new-content').value }));
document.querySelectorAll('[data-any]').forEach((button) => {
  button.onclick = () => {
    const id = $('any-id').value.trim();
    if (!id) return logLine('請輸入 document id', false);
    const method = button.dataset.any.toUpperCase();
    run(() => api(method, `/api/documents/${id}`, method === 'PUT' ? { title: $('any-title').value, content: '' } : undefined));
  };
});

(async () => {
  try { await handleCallback(); } catch (error) { logLine(error.message, false); }
  const tokens = storedTokens();
  if (!tokens) return;
  const c = claims(tokens.access_token);
  const roles = c.realm_access?.roles?.filter((r) => ['USER', 'ADMIN'].includes(r)) ?? [];
  $('who').textContent = `${c.preferred_username} [${roles.join(', ')}]  sub=${c.sub}`;
  $('f-actor-id').placeholder = `actorId,例如 ${c.sub}`;
  $('login').hidden = true;
  $('logout').hidden = false;
  loadDocuments();
  loadAudit();
})();
</script>
</body>
</html>
