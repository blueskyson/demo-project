# Sidecar in front of OpenFGA (shares its network namespace), only needed for the Playground.
#
# The Playground UI runs on https://play.fga.dev inside an iframe and calls the local API at
# http://127.0.0.1:8090. Chrome blocks a public site from calling a local address unless the
# preflight answers "Access-Control-Allow-Private-Network: true", which OpenFGA doesn't send.

# Host :8090 -> OpenFGA HTTP API (listening on 127.0.0.1:8090 / 0.0.0.0:8090 in the container)
server {
    listen 8091;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        # OpenFGA itself still answers CORS (allowed origin: https://play.fga.dev).
        add_header Access-Control-Allow-Private-Network true always;
    }
}

# Host :3000 -> Playground page, which OpenFGA only binds to 127.0.0.1:3000
server {
    listen 3001;

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
