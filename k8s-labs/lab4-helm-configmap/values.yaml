replicaCount: 1

image:
  repository: nginx
  tag: alpine
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 80

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi

config:
  greeting: "Hello from a ConfigMap environment variable! (via Helm)"
  pageTitle: "Helm ConfigMap Demo"
  pageMessage: "This page is served from a ConfigMap-mounted file, rendered by Helm."
