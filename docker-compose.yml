services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    container_name: esg-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - keycloak-data:/opt/keycloak/data
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  postgres:
    image: postgres:17
    container_name: esg-postgres
    environment:
      POSTGRES_DB: esg_award
      POSTGRES_USER: esg
      POSTGRES_PASSWORD: esg
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esg -d esg_award"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates OpenFGA's own database in the shared Postgres (idempotent, so it also
  # works on an existing postgres-data volume where init scripts don't rerun).
  openfga-db-init:
    image: postgres:17
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: esg
    entrypoint: ["sh", "-c"]
    command:
      - >
        echo "SELECT 'CREATE DATABASE openfga' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'openfga')\gexec"
        | psql -h postgres -U esg -d esg_award
    restart: "no"

  openfga-migrate:
    image: openfga/openfga:v1.21.0
    depends_on:
      openfga-db-init:
        condition: service_completed_successfully
    command: migrate
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://esg:esg@postgres:5432/openfga?sslmode=disable
    restart: "no"

  openfga:
    image: openfga/openfga:v1.21.0
    container_name: esg-openfga
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully
    command: run
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://esg:esg@postgres:5432/openfga?sslmode=disable
      # Listen on 8090 inside the container as well (host 8080 is Keycloak's): the
      # Playground calls the HTTP API from the browser on the same port number.
      OPENFGA_HTTP_ADDR: 0.0.0.0:8090
      # Web UI at http://localhost:3000/playground (dev only, deprecated upstream).
      OPENFGA_PLAYGROUND_ENABLED: "true"
      OPENFGA_PLAYGROUND_PORT: "3000"
      # The Playground UI is served from play.fga.dev (in an iframe) and calls the API from
      # there. Name the origin explicitly: "*" is rejected by browsers for credentialed requests.
      # (The backend talks to OpenFGA server-to-server, so CORS doesn't affect it.)
      OPENFGA_HTTP_CORS_ALLOWED_ORIGINS: https://play.fga.dev
      OPENFGA_LOG_FORMAT: json
    ports:
      # Both go through openfga-proxy below, which shares this container's network.
      - "8090:8091" # HTTP API
      - "3000:3001" # Playground
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=openfga:8081"]
      interval: 5s
      timeout: 5s
      retries: 10

  # nginx sidecar for the Playground (see openfga/playground-proxy.conf):
  # - the Playground page only listens on 127.0.0.1:3000, which Docker can't publish;
  # - Chrome needs "Access-Control-Allow-Private-Network" on API responses, which
  #   OpenFGA doesn't send.
  openfga-proxy:
    image: nginx:1.29-alpine
    network_mode: service:openfga
    depends_on:
      openfga:
        condition: service_healthy
    volumes:
      - ./openfga/playground-proxy.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  keycloak-data:
  postgres-data:
