services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    container_name: demo-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - keycloak-data:/opt/keycloak/data
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  openfga:
    image: openfga/openfga:v1.20.0
    container_name: demo-openfga
    command: run
    ports:
      - "8082:8080" # HTTP API (8080 is taken by Keycloak on the host)
      - "3000:3000" # Playground UI
    # No healthcheck: this image has no shell/curl/wget to exec into (distroless-style).
    # The backend's OpenFGA bootstrap retries with backoff instead of waiting on Docker.

volumes:
  keycloak-data:
